name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (types, lint, unitaires, navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-tests
          path: test-results/
          retention-days: 14

  app:
    name: Application réelle (fichiers, images, enregistrement)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - name: Tests Rust (stockage)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Construire l'application de test
        run: VITE_TEST_HOOKS=1 npx tauri build --debug --no-bundle
      - name: Piloter l'application
        run: xvfb-run -a node tauri-e2e/run.mjs

  mac:
    name: Application Mac (Apple Silicon)
    needs: [tests, app]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
      - name: Préparer les fichiers à télécharger
        run: |
          mkdir -p livraison
          cp src-tauri/target/release/bundle/dmg/*.dmg livraison/ || true
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/PrepVisPro.app livraison/PrepVisPro-app.zip
          ls -la livraison
      - uses: actions/upload-artifact@v4
        with:
          name: PrepVisPro-mac
          path: livraison/
          retention-days: 30
      - name: Publier la version (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: livraison/*
