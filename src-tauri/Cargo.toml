[package]
name = "topshot"
version = "0.16.0"
license = "MIT"
description = "Topshot — préparation image"
authors = ["Adrien Rousseau"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "topshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
